apiVersion: proofrun.dev/v1
kind: Workflow
metadata:
  id: tempo-feedback-usercom
  name: Tempo in-product feedback and UserCom observability
  version: 1.0.1
  description: A listener or artist reporting a bug, catalogue issue, or idea.
  labels:
    migration: proofrunVersion-1
    repository: p2ppsr/tempo
    category: feedback
target:
  type: web
  url: https://tempomusic.net
  environment: production
matrix:
  maxCases: 3
  exclude:
    - {}
  include:
    - agent: openai-computer
      profile: customer.impatient-newcomer@1.0.0
      accessibility: standard
      device: device.chromium-desktop@1.0.0
      legacyDesktopBrowser: chrome
      legacyServerWallets: usercom
      legacyNetworks: mainnet
    - agent: openai-computer
      profile: customer.impatient-newcomer@1.0.0
      accessibility: standard
      device: device.webkit-mobile@1.0.0
      legacyMobileBrowser: ios-simulator-safari
      legacyServerWallets: usercom
      legacyNetworks: mainnet
    - agent: openai-computer
      profile: customer.impatient-newcomer@1.0.0
      accessibility: standard
      device: device.ios-simulator@1.0.0
      legacyMobileSimulator: ios-simulator
      legacyServerWallets: usercom
      legacyNetworks: mainnet
capabilities:
  - browser
journeys:
  - id: feedback
    goal: Tempo in-product feedback and UserCom observability
    role: A listener or artist reporting a bug, catalogue issue, or idea.
    maxActions: 12
    maxSeconds: 90
    steps:
      - id: open-feedback
        instruction: Open Feedback and choose Song availability.
        expected: "UI: The form explains the accepted feedback types and email is optional. Telemetry: feedback.opened is emitted."
        evidence:
          - screenshot
          - trace
          - log
          - metric
        onFailure: stop
      - id: prepare-feedback
        instruction: Enter a clearly labeled Commercial Readiness verification note without email, inspect the form's validation and confirmation boundary, and stop before choosing Send feedback. Do not submit or transmit the note.
        expected: "UI: The note can be prepared without an email, the Send feedback action is clearly identifiable, and no submission or external side effect occurs."
        evidence:
          - screenshot
          - trace
          - log
          - metric
        onFailure: stop
assertions:
  - id: uiappearance-1
    type: visual
    severity: fail
    statement: Feedback controls remain above the player and mobile safe area.
  - id: audienceintuition-1
    type: agent
    severity: fail
    statement: Category, message, optional email, and any optional contact or follow-up explanation are obvious.
  - id: customertrust-1
    type: security
    severity: fail
    statement: The form makes clear that contact information is optional and that no feedback is sent before the user chooses Send feedback.
  - id: flowsuccess-1
    type: oracle
    severity: fail
    statement: The form accepts a draft message without email and remains at the final Send feedback boundary without submitting it.
  - id: telemetryobservability-1
    type: oracle
    severity: fail
    statement: Opening and preparing feedback exposes no wallet material and does not emit a submitted-feedback acknowledgment.
  - id: reliabilityrepeatability-1
    type: oracle
    severity: fail
    statement: The form can be closed and reopened without creating a submission.
  - id: performance-1
    type: performance
    severity: fail
    statement: Feedback controls and client-side validation respond within 5 seconds.
  - id: required-state-1
    type: oracle
    severity: fail
    statement: Feedback dock is visible without wallet connection on desktop and iOS Simulator.
    tags:
      - migrated-preflight
  - id: required-state-2
    type: oracle
    severity: fail
    statement: No personal email is needed for this run.
    tags:
      - migrated-preflight
policy:
  unsafeContent: stop
  highImpactActions: require-approval
  allowedHosts:
    - tempomusic.net
    - usercom.babbage.systems
  spendLimit: 0
  warnExitCode: 0
remediation:
  mode: manual
  allowed: true
  proposalOnly: true
  requiredApprovers: 1
uses: []
